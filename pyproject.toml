[project]
name = "adversary"
version = "0.1.0"
description = "Adversary: an independent verifier that writes tests the implementer can't see. OVERCLOCK: an optimizer that teaches itself to make code faster, gated by Adversary."
requires-python = ">=3.11"
dependencies = [
  "hypothesis>=6.100",
  "pytest>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
bench = ["evalplus>=0.3"]
swarm = ["uagents>=0.26,<0.27"]

[project.scripts]
adversary = "adversary.cli:main"
overclock = "overclock.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adversary*", "overclock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
